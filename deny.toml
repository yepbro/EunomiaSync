# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]

[advisories]
yanked = "warn"
# Unmaintained advisories only fail for workspace crates. Transitive
# unmaintained crates (e.g. zvariant_derive via tauri-plugin-opener,
# RUSTSEC-2026-0372, no safe upgrade available) are tolerated until
# upstream ships a fix.
unmaintained = "workspace"
# chrono is RUSTSEC-2026-0543 (unmaintained, no safe upgrade: all versions
# affected). It is pinned by spec 5.3 and was previously present in
# Cargo.lock only as an unused optional edge of serde_with — eunomia-store's
# direct dependency (DECISIONS.md D-031) puts it into the build graph for
# the first time, which the workspace-only unmaintained rule above fails.
# Switching to jiff/time is a spec-level decision, not a task-level one;
# revisit this ignore when the spec's time library changes.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is spec-pinned (5.3) with no safe upgrade; this direct edge puts it into the build graph for the first time (previously only an unused optional edge of serde_with); see DECISIONS.md D-031" },
]

[bans]
multiple-versions = "warn"

[sources]
# cargo-deny >= 0.18 replaced the single `unknown` key with these two;
# the intent (warn on unknown sources) is unchanged.
unknown-registry = "warn"
unknown-git = "warn"
