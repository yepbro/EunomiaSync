name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ESLint
        run: pnpm run lint
      - name: Prettier
        run: pnpm run format:check
      - name: TypeScript
        run: pnpm run typecheck

  test-matrix:
    name: test-matrix (${{ matrix.os }})
    strategy:
      # A red leg must not cancel the others: cross-OS failures are the
      # signal this matrix exists to catch (REL-001, spec §15.5).
      fail-fast: false
      matrix:
        # macos-15 is arm64 (M1); macos-15-intel is the macOS 15 x64
        # image — the standard free runner class for public repos
        # (4 CPU / 14 GB RAM). Per actions/runner-images#13045 the
        # label is available until August 2027; macos-26-intel already
        # provides the standard x64 successor — migrate before the label
        # retires (that 2025 announcement also signaled x86_64's
        # eventual end, so watch runner-images news beyond macos-26).
        # Intel runners also queue longer than arm64 ones, and one run now
        # starts 4 macOS jobs against the free plan's 5 concurrent macOS
        # slots: a queued or slow leg is infrastructure, not a flake.
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # Frontend unit tests stay on the Linux leg only (REL-001 reads the
      # frontend stack as platform-independent); the other legs run Rust
      # tests and need neither pnpm nor Node. Gated on runner.os, not the
      # label string, so a future ubuntu pin cannot switch them off.
      - name: Set up pnpm
        if: runner.os == 'Linux'
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        if: runner.os == 'Linux'
        run: pnpm install --frozen-lockfile
      # webview2-com-sys copies WebView2Loader.dll only into ITS OWN
      # build out-dir, while test binaries get a static import of the
      # DLL by name and run from other crates' out-dirs — the loader
      # then finds some foreign copy on the runner and dies with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139). Staging our own DLL
      # next to every test exe (exe dir is first in the search order)
      # makes resolution deterministic. The --no-run pre-build lets the
      # staging step see the DLL before any test binary executes.
      # The Common-Controls v6 manifest for the Windows test binaries
      # (T-241). tauri-build's RC embed rides embed-resource's
      # `cargo:rustc-link-arg-bins`, which reaches only [[bin]] targets —
      # including the bin's cargo-test harness link: the LIB test exes link
      # with no manifest, bind comctl32 5.82, and die at load with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) because tao/tauri
      # statically import the v6-only TaskDialogIndirect
      # (tauri-apps/tauri#13419).
      #
      # Dead ends measured on this repo, kept here so nobody walks them
      # again: RUSTFLAGS cannot carry /MANIFESTDEPENDENCY (cargo word-splits
      # it; a quoted space-bearing value cannot survive the cargo→rustc
      # hop); /MANIFEST:EMBED + /MANIFESTINPUT via RUSTFLAGS embeds fine but
      # collides with tauri's resource.lib on the bin test harness
      # (CVT1100 duplicate resource MANIFEST/1); /MANIFESTINPUT without
      # /MANIFEST:EMBED is refused outright (LNK1220).
      #
      # What works: an EXTERNAL manifest file. The loader picks
      # <exe>.manifest up for a manifest-less exe (the lib test harnesses)
      # and ignores it when an embedded manifest exists (the bin harness,
      # which keeps tauri's RC-embedded one — Vista+ precedence, see
      # "Specifying a Default Activation Context" on Microsoft Learn). No
      # linker involvement, so no collision and no fingerprint games.
      # Staged below, next to the DLL, for every eunomia-sync test exe.
      - name: Build tests (Windows DLL staging prerequisite)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run
      - name: Stage WebView2Loader.dll and v6 manifests beside test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path target\debug\build\webview2-com-sys -Recurse -Filter WebView2Loader.dll |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if (-not $dll) { throw "x64 WebView2Loader.dll not found under webview2-com-sys out-dir" }
          Write-Host "staging from: $($dll.FullName)"
          Copy-Item $dll.FullName -Destination target\debug -Force
          Get-ChildItem -Path target\debug\build -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '\\out\\' } |
            ForEach-Object { Copy-Item $dll.FullName -Destination $_.DirectoryName -Force }
          # T-241: external Common-Controls v6 manifest for every
          # eunomia-sync test exe — ignored where an embedded manifest
          # exists (bin harness), picked up where none does (lib harness).
          # cargo 1.100's build-dir layout v2 places test exes in
          # build/<pkg>/<hash>/out; deps/ covers the pre-1.100 layout.
          $manifest = 'src-tauri\windows\app.manifest'
          Get-ChildItem -Path target\debug\build\eunomia-sync -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '\\out\\' } |
            ForEach-Object { Copy-Item $manifest -Destination "$($_.FullName).manifest" -Force }
          Get-ChildItem -Path target\debug\deps -Filter 'eunomia_sync*.exe' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $manifest -Destination "$($_.FullName).manifest" -Force }
      - name: Rust tests
        run: cargo test --workspace
      # The eunomia-sync lib test exe still dies at startup with
      # STATUS_ENTRYPOINT_NOT_FOUND even with our x64 WebView2Loader
      # staged beside it. Running the exe directly from pwsh surfaces
      # the loader's exact message ("The procedure entry point X could
      # not be located in Y") — the diagnosis the cargo runner swallows.
      - name: Loader diagnostics for the lib test exe (Windows)
        if: runner.os == 'Windows' && failure()
        shell: bash
        run: |
          python - <<'PY'
          import struct, glob
          def sections(data):
              pe = data.index(b'PE\0\0') + 4
              nsec, = struct.unpack_from('<H', data, pe + 2)
              optsz, = struct.unpack_from('<H', data, pe + 16)
              opt = pe + 20
              magic, = struct.unpack_from('<H', data, opt)
              dd = opt + (0x60 if magic == 0x10b else 0x70)
              rva, = struct.unpack_from('<I', data, dd)
              secs = []
              for i in range(nsec):
                  vsz, va, rsz, roff = struct.unpack_from('<IIII', data, opt + optsz + i * 40 + 8)
                  secs.append((va, rsz, roff))
              return secs, rva
          def imports(path):
              data = open(path, 'rb').read()
              secs, rva = sections(data)
              def r2o(r):
                  for va, rsz, roff in secs:
                      if va <= r < va + rsz:
                          return roff + (r - va)
              out, o = [], r2o(rva)
              while o:
                  thunkrva, = struct.unpack_from('<I', data, o)
                  namerva, = struct.unpack_from('<I', data, o + 12)
                  if namerva == 0:
                      break
                  no = r2o(namerva)
                  dll = data[no:data.index(b'\0', no)].decode()
                  funcs = []
                  if thunkrva:
                      t = r2o(thunkrva)
                      while t:
                          frva, = struct.unpack_from('<Q', data, t)
                          if frva == 0:
                              break
                          if not frva & (1 << 63):
                              fo = r2o(frva)
                              end = data.index(b'\0', fo + 2)
                              funcs.append(data[fo + 2:end].decode())
                          t += 8
                  out.append((dll, funcs))
                  o += 20
              return out
          lib_exe = glob.glob(r'target\debug\build\eunomia-sync\*\out\eunomia_sync_lib-*.exe')[0]
          store_exe = glob.glob(r'target\debug\build\eunomia-store\*\out\settings-*.exe')[0]
          lib, store = imports(lib_exe), imports(store_exe)
          print('LIB-TEST imports:', *(d for d, _ in lib), sep='\n  ')
          print('ONLY-IN-LIB (suspects):', *(set(d for d, _ in lib) - set(d for d, _ in store)), sep='\n  ')
          for dll, funcs in lib:
              if dll.lower() == 'comctl32.dll':
                  print('COMCTL32 IMPORTED FUNCTIONS:', *funcs, sep='\n  ')
          data = open(lib_exe, 'rb').read()
          print('EMBEDDED MANIFEST PRESENT:', b'Microsoft.Windows.Common-Controls' in data)
          if b'Microsoft.Windows.Common-Controls' in data:
              i = data.index(b'<assembly')
              print('MANIFEST HEAD:', data[i:i+400].decode('ascii', 'replace'))
          ext = open(lib_exe + '.manifest', 'rb').read() if __import__('os').path.exists(lib_exe + '.manifest') else b''
          print('EXTERNAL MANIFEST FILE:', bool(ext))
          if b'Microsoft.Windows.Common-Controls' in ext:
              i = ext.index(b'<assembly')
              print('EXTERNAL MANIFEST HEAD:', ext[i:i+400].decode('ascii', 'replace'))
          elif ext:
              print('EXTERNAL MANIFEST (no Common-Controls dep!) HEAD:', ext[:400].decode('ascii', 'replace'))
          PY
          echo "--- eunomia-sync build script instructions cargo recorded ---"
          cat target/debug/build/eunomia-sync/*/run/stdout target/debug/build/eunomia-sync-*/output 2>/dev/null | grep -aE "link-arg|MANIFEST" || echo "(no link-arg lines recorded)"
      - name: Frontend unit tests
        if: runner.os == 'Linux'
        run: pnpm run test

  # Stable required-check context: main's branch protection requires a
  # check literally named "test", while a matrix reports one check per
  # leg — this gate maps the matrix roll-up back onto that one context.
  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every test-matrix leg
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          echo "test-matrix roll-up result: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = "success"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm run e2e

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel adds the macOS x64 compile leg (spec §14 wants
        # arm64 and x64 artifacts; the bundled .dmg/.app artifacts arrive
        # with the release task — this is the x64 build smoke); for the
        # Intel-label lifecycle see the comment on the test-matrix job
        # above.
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file
      - name: Build (debug, no bundle)
        # pnpm passes the `--` separator through to the script, so tauri would
        # forward `--debug --no-bundle` to cargo and fail; pass them as tauri
        # options directly (npm swallowed `--`, pnpm does not).
        run: pnpm run tauri build --debug --no-bundle
