[package]
name = "eunomia-sync"
version = "0.1.0"
description = "EunomiaSync desktop client — keep AGENTS.md files in sync across projects"
authors = ["EunomiaSync contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eunomia_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eunomia-core = { path = "../crates/eunomia-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed IPC bindings (src/bindings.ts is generated at debug build time).
# specta must be pinned exactly, per the tauri-specta v2 RC guidance.
specta = "=2.0.0-rc.28"
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }

[dev-dependencies]
# The `test` feature enables the mock runtime used by the IPC tests.
tauri = { version = "2", features = ["test"] }
