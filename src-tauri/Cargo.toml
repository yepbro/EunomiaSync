[package]
name = "eunomia-sync"
version.workspace = true
description = "EunomiaSync desktop client — keep AGENTS.md files in sync across projects"
authors = ["Den Brooks <denis@yepbro.pro>"]
edition.workspace = true
license.workspace = true
publish = false

[lints]
# The workspace-wide clippy gate ([workspace.lints.clippy] in the root
# Cargo.toml): no eprintln!/println! in production code.
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eunomia_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eunomia-store = { path = "../crates/eunomia-store" }
# The project-folder availability probe of `projects_list` (commands.rs,
# T-072, spec DB-032/D-09 over the D-084 check): a read-only use of
# `eunomia_fs::paths::check_project_available`, the crate itself is
# untouched. Not a new crate in the graph: eunomia-fs is a workspace
# member (its tempfile dependency is already resolved workspace-wide
# for src-tauri's dev-dependencies) — this adds an edge, not a version.
eunomia-fs = { path = "../crates/eunomia-fs" }
# The new-project composition of `project_add_manual` (commands.rs,
# T-074): `eunomia_core::color_pick::pick_color` (D-29) and the
# `project_validators` (default_label/DB-042, §6.9) — read-only reuse,
# the crate itself untouched. Not a new crate in the graph:
# eunomia-core is a workspace member already built through eunomia-fs
# — this adds an edge, not a version (the D-096 eunomia-fs precedent).
eunomia-core = { path = "../crates/eunomia-core" }
# The DB executor (db.rs, D-037) owns rusqlite types directly — the
# connection behind the mutex and the transaction it hands to
# operations. Not a new crate in the graph: rusqlite 0.41 is already
# built through eunomia-store (this adds an edge, not a version), and
# no features are restated here — the store stays the single
# declaration point for the build shape (bundled SQLite), which the
# version comment in its manifest pins against rusqlite_migration.
rusqlite = "0.41"
# The injectable date seam of the ERR-001 daily backup (db.rs,
# DECISIONS.md D-046): `Timestamp::now()` at the setup call site and
# the `Timestamp` parameter the seam takes. Not a new crate in the
# graph: jiff 1 is already built through eunomia-store (values.rs,
# D-035) — this adds an edge, not a version.
jiff = { version = "1", default-features = false, features = ["std"] }
# The LOG-006 daily tick of the retention task (retention.rs,
# DECISIONS.md D-054): `tokio::time::sleep` inside a
# `tauri::async_runtime::spawn`ed task — tauri's async runtime re-exports
# its task API but not its timers, and its own docs point at tokio for
# the missing items. Not a new crate in the graph: tokio 1 is already
# resolved workspace-wide (via tauri), and only the `time` feature is
# requested — no runtime, no macros.
tokio = { version = "1", default-features = false, features = ["time"] }
tauri = { version = "2", features = [] }
# The full allowed Tauri plugin set (spec §5.3). All four plugins are
# invoked from Rust only (SEC-001): the webview gets neither their JS
# packages nor their permissions (see capabilities/default.json). No
# other plugin crates are wired — any additional `tauri-plugin-*` line
# (or a workspace-alias indirection) turns a config_tests.rs pin red.
# The remaining D-28 exclusions are non-plugin decisions and are not
# guarded by that pin. `single-instance` must stay the FIRST registered
# plugin in `lib.rs` (plugin requirement).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Markdown preview pipeline (markdown.rs, `markdown_preview`, spec
# §7.10 Library module, SEC-005, D-15; DECISIONS.md T-056 entry): CommonMark
# parsing and HTML generation. §5.3 names pulldown-cmark for exactly this
# ("Preview and warnings. Not used when building files") but pins no crate
# for it; it cannot live in eunomia-core — §5.2 restricts core to
# serde/sha2/thiserror (D-017) — so the renderer sits here, beside the
# command. License MIT — inside the cargo-deny allow-list. Naming note:
# SEC-005's ammonia joins this pipeline separately (the sanitizer, below);
# the raw-HTML escaping happens in markdown.rs before it. New
# dependencies in the graph (not an existing version re-used like
# rusqlite/jiff/tokio above): both are new license/advisory rows for
# `cargo deny check` (both pass).
# `default-features = false` drops the `getopts`-backed CLI machinery of
# the crate's default feature set (a library consumer needs none of it);
# `html` pulls in the escape crate behind `html::push_html`, the renderer
# the pipeline is built on.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# SEC-005's sanitizer: "the HTML is sanitized (`ammonia`)" — the
# spec-named second gate of markdown.rs's pipeline (the first gate is
# the raw-HTML escaping). It re-parses whatever HTML string it is
# handed, so no version-alignment constraint exists between the two
# crates. MIT OR Apache-2.0 — inside the cargo-deny allow-list.
ammonia = "4"
# File logging (spec §5.3, SYS-011..013, SEC-008; DECISIONS.md D-032).
# `tracing` 0.1 is already resolved workspace-wide (0.1.44 via tauri), so
# that line adds no new version to the graph. `tracing-subscriber` is the
# fmt layer that formats events for the appender writer — `fmt` only, no
# default features: no ANSI escapes in log files, no `env-filter` (the
# level comes from config.toml, SYS-012, not from RUST_LOG).
# `tracing-appender` provides the non_blocking writer thread the file
# log rides on (T-255: the daily+10 MB rotation itself is the app's own
# writer in logging.rs — the ruling's "5 × 10 MB" needed a size cap the
# crate's time-based rotation cannot express; logs/eunomiasync.<date>.log
# and its same-day parts, spec §5.5 + the DECISIONS.md T-255 entry).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-appender = "0.2"
# The machine-level config.toml parser (spec §5.8, SYS-013, D-001).
# The `1` line is already resolved workspace-wide (1.2.1 via tauri), so
# this adds no new crate version to the graph.
toml = "1"
# Typed IPC bindings (src/bindings.ts is generated at debug build time).
# specta must be pinned exactly, per the tauri-specta v2 RC guidance.
specta = "=2.0.0-rc.28"
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }

# The NFR-023 root-launch detection (commands.rs, T-032): the one libc
# call `geteuid` behind the `running_as_root` flag of `app_info`. Not a
# new crate in the graph: libc 0.2 is already built workspace-wide
# (via gtk/tao on Linux) — this adds an edge, not a version — and the
# Linux-only target gate keeps the dependency off Windows/macOS builds,
# where NFR-023 assigns no root warning. The crate's single `unsafe`
# block lives in the same seam; both are justified in DECISIONS.md.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The `test` feature enables the mock runtime used by the updater and
# single-instance tests (and formerly the greet IPC tests, removed
# with D-037).
tauri = { version = "2", features = ["test"] }
# Ephemeral roots for the data_dirs layout tests. Not a new crate in the
# dependency graph: `tempfile` 3 is already resolved workspace-wide via
# eunomia-fs; this only adds a dev-only edge for src-tauri.
tempfile = "3"
# eunomia-fs's fault-injection feature, enabled for THIS package's test
# builds only (T-130, DECISIONS.md D-226) — the same pattern the fs
# crate's own self dev-dependency uses, applied cross-crate: the edge
# participates whenever eunomia-sync's test targets resolve
# dev-dependencies (`cargo test -p eunomia-sync`, a workspace-wide test
# build), so `eunomia_fs::fault_injection`'s pause points — spec 15.1's
# "force-killing the process" mechanism — are visible to the kill-test
# suite; `cargo build` / `cargo build --release` never resolve
# dev-dependencies, so every production artifact still compiles
# eunomia-fs with the feature off. Not a new crate in the graph (the
# regular `eunomia-fs` edge above already builds it); no features are
# added to the release path.
eunomia-fs = { path = "../crates/eunomia-fs", features = ["fault-injection"] }
# The updater pubkey well-formedness oracle of `config_tests.rs` (T-133,
# DECISIONS.md D-229): the pin decodes the `plugins.updater` pubkey the
# same way the plugin does at artifact-verification time — base64
# STANDARD decode, then `minisign_verify::PublicKey::decode` — so a key
# the plugin could never use fails at test time. Both are test-only
# edges to already-resolved graph nodes (base64 0.23.1 is built via
# tauri-plugin-updater, minisign-verify 0.3.0 the same), not new crates:
# no new version, no production build resolves them, and cargo-deny
# already licenses both through the updater dependency.
base64 = "0.23"
minisign-verify = "0.3"
