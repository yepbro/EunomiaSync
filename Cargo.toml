[workspace]
members = [
  "benches/eunomia-load",
  "crates/eunomia-core",
  "crates/eunomia-fs",
  "crates/eunomia-store",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
