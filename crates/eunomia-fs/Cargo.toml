[package]
name = "eunomia-fs"
version.workspace = true
edition.workspace = true
description = "File-system layer for EunomiaSync: repository scan, path normalization, backup copies, and atomic writes, independent of Tauri."
license.workspace = true
publish = false

[features]
default = []
# Fault injection for tests (spec 15.1's "failure points in `fs`",
# NFR-024's kill-test substrate; task T-069, DECISIONS.md D-101).
# Release guarantee, by construction: the feature is not in `default`
# and no [dependencies] edge in the workspace enables it — the only
# automatic enablement is this crate's own self dev-dependency below,
# which exists so a plain `cargo test` exercises the fault points.
# `cargo build` and `cargo build --release` never resolve
# dev-dependencies, so every production artifact (including the
# Tauri app) compiles this crate with the feature off; and the module
# itself refuses to compile in a release profile (a compile_error!),
# closing the one unification hole cargo leaves open (`cargo build
# --release --all-targets` / `cargo test --release` resolve
# dev-dependencies). Absence is verified with `strings`, NOT `nm`:
# the workspace strips release symbols ([profile.release] strip =
# true), so nm shows nothing in ANY release rlib — a vacuous check.
# The two-step method: `cargo build --release -p eunomia-fs` then
# `strings target/release/libeunomia_fs.rlib | grep -c
# eunomia_fs15fault_injection` → 0, with a feature-enabled dev build
# of the same crate as the control (the scan finds the symbols
# there). See src/fault_injection.rs for the point catalogue.
fault-injection = []

[dependencies]
# Dependency set pinned by the spec (docs/spec.md 5.2) and the owner
# rulings of 2026-11-19 (DB-030 as amended in spec commits 1e1b930 and
# 9a953d9; the DECISIONS.md entry of this task records the adoption).
# The `walkdir`/`tempfile` modules are still skeleton stubs, so those
# two stay intentionally idle until the task that implements their use
# lands (precedent: the spec-pinned allow-list of eunomia-core,
# DECISIONS.md D-017):
# - `ignore` drives the repository scan (spec 9.6, ALG-050): its parallel
#   WalkBuilder, run with .gitignore reading disabled; active since the
#   scan task (T-061) landed;
# - `walkdir` covers plain recursive traversal outside the repository-scan
#   algorithm, e.g. the app's own data directory (scan, backup);
# - `tempfile` stages same-folder write-then-rename file updates (atomic,
#   spec 9.5);
# - `dunce` canonicalizes paths without Windows verbatim (`\\?\`) prefixes
#   — the DB-030 canonical form (paths), and the stored path is its
#   verbatim output; active since the canonicalization task landed;
# - `unicode-normalization` applies DB-030's Unicode NFC to the path_key
#   on Windows and macOS (paths); the stored path stays verbatim — NFC
#   and folding are key-only by the owner ruling of 2026-11-19. License:
#   Unicode-3.0, already in deny.toml's allow list;
# - `unicode-case-mapping` provides Unicode SIMPLE case folding for the
#   same key rule — exactly the 1:1 mappings (CaseFolding.txt statuses C
#   and S), the filesystem-faithful fold where ligatures stay distinct
#   (ﬁ ≠ fi, ß stays ß, İ stays İ) while 1:1 mappings fold (ſ → s, ẞ → ß).
#   The first candidate, `focaccia`, turned out comparison-only with no
#   simple-folding variant; the owner ruling swapped it for this crate
#   (spec commits 1e1b930 and 9a953d9). License: Apache-2.0, already in
#   deny.toml's allow list.
unicode-normalization = "0.1"
unicode-case-mapping = "1"

# - `rustix` queries free space on the data-directory volume (free_space,
#   spec 9.4 phase 1, 10): its `fs` feature exposes `statvfs`
#   (f_bavail × f_frsize). Sanctioned by the §5.2 fs row as amended in
#   f3db54f and owner-approved in chat (2026-11-19); rustix 1.x is already
#   in Cargo.lock as a transitive dependency of `tempfile`, so the
#   promotion adds zero new crates to the graph. NOTE: rustix has no `fs`
#   module on Windows — the Windows free-space probe is the target-gated
#   `GetDiskFreeSpaceExW` call at the bottom of this manifest (D-089's
#   addendum), so this edge is unix-effective only.
rustix = { version = "1", features = ["fs"] }

# Target-file watching (spec 5.7) needs `notify-debouncer-full`; it is not
# part of this dependency set yet and joins with its own module and task.
ignore = "0.4"
walkdir = "2"
tempfile = "3"
dunce = "1"
# Domain types for scan/backup results (spec 5.2 lists `core`). Deliberate
# departure from D-017's store rule (core edge only with the first
# consumer): the card fixes this crate's dependency set at creation, so the
# edge is wired now; active since the backup task landed (the §7.6/§5.5
# name builders of `backup_name` and the incremental SHA-256 of `hash` —
# fs hashes through core and never names `sha2` itself).
eunomia-core = { path = "../eunomia-core" }

# --- Windows free-space probe (free_space, spec 9.4 phase 1) ------------
# `GetDiskFreeSpaceExW` answers the same §9.4 question as the unix
# `statvfs` probe above: the bytes available to the caller on the volume
# of the data directory. Owner-sanctioned in chat (2026-11-19) as the
# resolution of D-089's escalation (see the D-089 addendum; the §5.2 fs
# row as amended in docs commit 332fc8b sanctions exactly this call).
# windows-sys 0.61.2 is already in Cargo.lock via the tauri stack, so the
# direct edge adds zero new crates; target-gated so Linux and macOS
# builds do not resolve it (the `[dependencies]` block above is
# untouched). `Win32_Storage_FileSystem` is the only feature gate needed:
# `GetDiskFreeSpaceExW` lives in
# `windows_sys::Win32::Storage::FileSystem`, and the `BOOL`/`PCWSTR`
# types it references come from `windows_sys::core`, which is not
# feature-gated.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The crate's own integration tests (tests/) drive the spec 15.1
# fault points through the public API the `fault-injection` feature
# exposes. A package dev-depending on itself by path is cargo's
# supported way to turn a feature on for test builds only: the edge
# participates in `cargo test` (so the points are exercised without
# a command-line flag) and is invisible to `cargo build` /
# `--release`, keeping the release guarantee recorded on the feature
# above intact.
eunomia-fs = { path = ".", features = ["fault-injection"] }
