[package]
name = "eunomia-store"
version.workspace = true
edition.workspace = true
description = "Database layer for EunomiaSync: SQLite storage and embedded SQL migrations, independent of Tauri."
license.workspace = true
publish = false

[dependencies]
# rusqlite version must stay aligned with rusqlite_migration's own rusqlite
# requirement (^0.41), otherwise two libsqlite3-sys copies (links = "sqlite3")
# conflict within the workspace.
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
# UUIDv7 row identifiers as TEXT (spec DB-002, §5.3; DECISIONS.md D-031).
# Feature `v7` enables the RFC 9562 builder with the counter-backed shared
# context behind `now_v7()`'s per-process ordering guarantee (D-031).
# The version is already resolved workspace-wide (1.29.3 via tauri), so
# this adds no new crate version to the graph.
uuid = { version = "1", features = ["v7"] }
# UTC wall clock for ISO-8601 timestamps (spec DB-002, §5.3; DECISIONS.md
# D-031, including the RUSTSEC-2026-0543 unmaintained advisory and the
# scoped deny.toml ignore behind this direct dependency). Minimal feature
# set: `now` (= `std` + `alloc`) covers `Utc::now()` and `to_rfc3339_opts`;
# `clock` (which would pull `iana-time-zone` for local time — that belongs
# to the app layer per spec §5.3), the wasm bindings, and the empty legacy
# `oldtime` feature are not requested. Version note: 0.4.45 was already
# pinned in Cargo.lock as an unused optional edge of serde_with — nothing
# compiled it before this dependency, which puts chrono into the build
# graph for the first time (no new crate version; the advisory handling
# is recorded in D-031).
chrono = { version = "0.4", default-features = false, features = ["now"] }
