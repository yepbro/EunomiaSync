[package]
name = "eunomia-store"
version.workspace = true
edition.workspace = true
description = "Database layer for EunomiaSync: SQLite storage and embedded SQL migrations, independent of Tauri."
license.workspace = true
publish = false

[dependencies]
# rusqlite version must stay aligned with rusqlite_migration's own rusqlite
# requirement (^0.41), otherwise two libsqlite3-sys copies (links = "sqlite3")
# conflict within the workspace.
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
# UUIDv7 row identifiers as TEXT (spec DB-002, §5.3; DECISIONS.md D-031).
# Feature `v7` enables the RFC 9562 builder with the counter-backed shared
# context behind `now_v7()`'s per-process ordering guarantee (D-031).
# The version is already resolved workspace-wide (1.29.3 via tauri), so
# this adds no new crate version to the graph.
uuid = { version = "1", features = ["v7"] }
# UTC wall clock for ISO-8601 timestamps (spec DB-002, §5.3; DECISIONS.md
# D-031 for the helpers' contract, D-035 for the chrono → jiff migration).
# Minimal feature set: `std` covers `Timestamp::now()` and `strftime`
# formatting; the IANA tz features (`tz-system`, `tzdb-*`) are deliberately
# off until the creation-marker task needs local time — jiff then covers
# that natively, without the separate iana-time-zone crate (D-035).
jiff = { version = "1", default-features = false, features = ["std"] }
# JSON encoding of setting values in the `settings` table (spec §6.5;
# DECISIONS.md D-039). No `serde` derive: values are parsed from
# `serde_json::Value` directly, keeping the dependency surface at one
# crate. The version is already resolved workspace-wide (1.0.154 via
# src-tauri), so this adds no new crate version to the graph — the
# same lockfile-reuse pattern as `uuid` (D-031).
serde_json = "1"
