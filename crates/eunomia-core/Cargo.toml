[package]
name = "eunomia-core"
version = "0.1.0"
edition = "2024"
description = "Core library for EunomiaSync: storage, markdown, diff, sync, and watch logic, independent of Tauri."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# rusqlite version must stay aligned with rusqlite_migration's own rusqlite
# requirement (^0.41), otherwise two libsqlite3-sys copies (links = "sqlite3")
# conflict within the workspace.
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
