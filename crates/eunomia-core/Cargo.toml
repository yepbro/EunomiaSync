[package]
name = "eunomia-core"
version.workspace = true
edition.workspace = true
description = "Core library for EunomiaSync: domain types, markdown, diff, sync, and watch logic, independent of Tauri and of any database."
license.workspace = true
publish = false

[dependencies]
# Dependency allow-list pinned by the spec (docs/spec.md 5.2): core stays
# pure logic with no I/O — database code lives in `eunomia-store`. `serde`
# backs the canonical forms of the domain vocabulary (schema §6.2 CHECK
# literals and §6.5 JSON shapes), `thiserror` the domain error types
# (`HeadingLevel`/snapshot assembly). `sha2` is in use (the build hash,
# D-064; the color tie-break, D-077; the version snapshots, D-082).
# Note: the spec's tech stack (5.3) also names
# `similar` for text diffing, which is outside this allow-list —
# adopting it (or placing diff elsewhere) is a decision for the diff
# task, not a silent addition.
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
# The creation-marker clock (ALG-032: time "taken once per run"; DECISIONS.md
# entry for this task). jiff is the project time library (D-035 replaced
# chrono); this is the D-035-predicted feature turn-on for the marker task:
# `tz-system` detects the system zone (TZ env var, /etc/localtime, Windows
# registry), `tzdb-zoneinfo` reads the Unix tzdb (/usr/share/zoneinfo),
# `tzdb-bundle-platform` embeds a tzdb on Windows only — jiff target-gates
# it, so Linux/macOS builds compile none of it (the two lock entries it
# adds, jiff-tzdb/jiff-tzdb-platform 1.0.0, stay unused rows on Unix, the
# D-035 lockfile posture; windows-link was already in the graph). Outside
# this module's need: no new crate enters core (spec 5.3 dropped
# iana-time-zone for jiff's built-in IANA support).
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

[dev-dependencies]
# Property tests of the body builder (spec 15.1 names them for random
# trees; 5.3 pins proptest in the test toolchain) — a spec-pinned,
# dev-only addition recorded in DECISIONS.md, outside the runtime
# allow-list of D-017. Minimal features: `std` plus `bit-set`; the
# `fork`/`timeout` machinery (rusty-fork, tempfile) is not used — the
# properties are pure and fast.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Pins the canonical serde literals of the domain vocabulary in unit
# tests and doc tests. Already resolved workspace-wide (1.0.154 via
# src-tauri), so this adds no new crate version to the graph.
serde_json = "1"
